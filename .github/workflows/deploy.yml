name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Убедитесь, что ваша основная ветка называется main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Это самая важная часть: берем секрет из GitHub Secrets 
          # и превращаем его в переменную окружения для Vite
          API_KEY: ${{ secrets.API_KEY }} 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
